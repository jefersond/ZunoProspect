name: MP Readonly Diagnostic Temp

on:
  push:
    branches:
      - test/mp-readonly-diagnostic-2026-09-28

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect existing Supabase admin credential
        env:
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROJECT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SERVICE_ROLE:-}" ] && echo "HAS_SERVICE_ROLE=true" || echo "HAS_SERVICE_ROLE=false"
          [ -n "${SERVICE_KEY:-}" ] && echo "HAS_SERVICE_KEY=true" || echo "HAS_SERVICE_KEY=false"
          [ -n "${ACCESS_TOKEN:-}" ] && echo "HAS_ACCESS_TOKEN=true" || echo "HAS_ACCESS_TOKEN=false"
          [ -n "${PROJECT_ACCESS_TOKEN:-}" ] && echo "HAS_PROJECT_ACCESS_TOKEN=true" || echo "HAS_PROJECT_ACCESS_TOKEN=false"
