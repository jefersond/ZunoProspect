name: Stripe Secret Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-tracked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Reject tracked temporary files under .tmp/
        shell: bash
        run: |
          set -euo pipefail
          tmp_files=$(git ls-files -- .tmp)
          if [ -n "$tmp_files" ]; then
            echo "::error::Tracked files found under .tmp/. Temporary audit/debug scripts must never be committed."
            printf '%s\n' "$tmp_files"
            exit 1
          fi
          echo "No tracked files under .tmp/."

      - name: Reject live Stripe and provider credentials in tracked text files
        shell: bash
        run: |
          set -euo pipefail
          # Only report filenames and rule IDs; never print matched text or credential values.
          node <<'EOF'
          const { execFileSync } = require("child_process");
          const fs = require("fs");

          const trackedFiles = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" })
            .split("\0")
            .filter(Boolean);

          const rules = [
            { id: "stripe-live-key", re: /\b(?:sk|rk)_live_[A-Za-z0-9_]{16,}\b/g },
            { id: "stripe-webhook-secret", re: /\bwhsec_[A-Za-z0-9_]{16,}\b/g, allowDummy: true },
            { id: "supabase-access-token", re: /\bsbp_[A-Za-z0-9]{20,}\b/g },
            { id: "resend-api-key", re: /\bre_[A-Za-z0-9_]{20,}\b/g },
            { id: "google-api-key", re: /\bAIza[0-9A-Za-z_-]{30,}\b/g },
            { id: "mercadopago-prod-token", re: /\bAPP_USR-[0-9]{10,}-[0-9]{6}-[a-f0-9]{32}-[0-9]+\b/g },
          ];

          const dummyRe = /(?:test|mock|dummy|local|example|placeholder|fake|sample|xxxx)/i;
          const findings = [];

          for (const file of trackedFiles) {
            if (file === ".github/workflows/stripe-secret-guard.yml") continue;
            let buf;
            try {
              buf = fs.readFileSync(file);
            } catch {
              continue;
            }
            if (buf.includes(0)) continue; // skip binary files
            const text = buf.toString("utf8");

            for (const rule of rules) {
              const matches = text.match(rule.re);
              if (!matches) continue;
              const realMatches = rule.allowDummy
                ? matches.filter((m) => !dummyRe.test(m))
                : matches;
              if (realMatches.length > 0) {
                findings.push({ file, rule: rule.id, count: realMatches.length });
              }
            }
          }

          if (findings.length > 0) {
            for (const f of findings) {
              console.error(`::error::Potential exposed credential (${f.rule}, matches=${f.count}) in tracked file: ${f.file}`);
            }
            process.exit(1);
          }

          console.log(`Scanned ${trackedFiles.length} tracked files. No exposed credentials detected.`);
          EOF
