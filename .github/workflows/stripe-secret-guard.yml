name: Stripe Secret Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-tracked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject live Stripe credentials in tracked text files
        shell: bash
        run: |
          set -euo pipefail
          # Only filenames, never matched text or credential values.
          set +e
          git grep -I -l -E '(sk|rk)_live_[[:alnum:]_]{20,}' HEAD -- . > "$RUNNER_TEMP/stripe-secret-matches"
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "::error::Potential live Stripe credential in tracked source. Rotate it and remove it from Git."
            exit 1
          fi
          if [ "$result" -ne 1 ]; then
            echo "::error::Secret scan could not complete."
            exit 1
          fi
          echo "No live Stripe credential pattern found in tracked text files."
