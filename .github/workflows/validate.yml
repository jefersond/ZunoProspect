name: Validate ZunoProspect

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The repository has legacy lint debt outside this bridge. Until that
      # baseline is remediated separately, this PR is required to introduce
      # zero lint warnings/errors in every file it adds for the integration.
      - name: Lint Zanotelli bridge changes
        run: >-
          npx eslint
          supabase/functions/_shared/zanotelli-inbound-bridge.ts
          supabase/functions/zanotelli-internal-prospecting/index.ts
          src/security/zanotelliInternalProspectingBridge.test.ts
          --max-warnings=0

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
